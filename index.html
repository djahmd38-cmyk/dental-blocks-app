<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مختبر الأسنان - إدارة وتتبع بلوكات الخراطة CAD/CAM</title>
  <meta name="description" content="نظام إدارة ومتابعة استهلاك أقراص وبلوكات تفريز الأسنان CAD/CAM للمختبرات الرقمية مع حفظ محلي كامل بدون خادم." />
  
  <!-- خطوط Google: Cairo و Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- مكتبات React 18 و ReactDOM و Babel للتشغيل المباشر في المتصفح -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Cairo', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.7); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // أيقونات SVG خفيفة ومدمجة بدون أي مكتبة خارجية
    const Icons = {
      Disc: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
          <path d="M12 2a10 10 0 0 0 -9 5.5" />
          <path d="M12 22a10 10 0 0 0 9 -5.5" />
        </svg>
      ),
      Plus: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M5 12h14" /><path d="M12 5v14" />
        </svg>
      ),
      Search: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
        </svg>
      ),
      Check: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      ),
      CheckCircle2: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      ),
      RotateCcw: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" />
        </svg>
      ),
      Edit: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" />
        </svg>
      ),
      Trash2: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
        </svg>
      ),
      Copy: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
        </svg>
      ),
      Sun: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" /><path d="M20 12h2" />
        </svg>
      ),
      Moon: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      ),
      Download: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" />
        </svg>
      ),
      Upload: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" /><line x1="12" x2="12" y1="3" y2="15" />
        </svg>
      ),
      RefreshCw: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
      ),
      LayoutGrid: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" />
          <rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" />
        </svg>
      ),
      List: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="8" x2="21" y1="6" y2="6" /><line x1="8" x2="21" y1="12" y2="12" /><line x1="8" x2="21" y1="18" y2="18" />
          <line x1="3" x2="3.01" y1="6" y2="6" /><line x1="3" x2="3.01" y1="12" y2="12" /><line x1="3" x2="3.01" y1="18" y2="18" />
        </svg>
      ),
      X: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M18 6 6 18" /><path d="m6 6 12 12" />
        </svg>
      )
    };

    // بيانات تجريبية أولية لمختبر الأسنان
    const INITIAL_DENTAL_BLOCKS = [
      {
        id: 'blk-001',
        brand: 'Kuraray Noritake Katana',
        material: 'Zirconia',
        type: 'Disc',
        shade: 'A2 Multilayer',
        thickness: '18mm',
        lotNumber: 'KZ-2024-9120',
        status: 'in_use',
        usagePercentage: 65,
        unitsUsed: 16,
        maxEstimatedUnits: 25,
        machineAssigned: 'Roland DWX-52D',
        notes: 'HTML (High Translucent Multi Layered) - للجسور الأمامية والخلفية.',
        createdAt: new Date().toISOString(),
      },
      {
        id: 'blk-002',
        brand: 'Ivoclar IPS e.max CAD',
        material: 'E.max',
        type: 'Block',
        shade: 'HT A1',
        thickness: 'C14',
        lotNumber: 'EM-8821-X',
        status: 'completed',
        usagePercentage: 100,
        unitsUsed: 1,
        maxEstimatedUnits: 1,
        machineAssigned: 'VHF K5+',
        notes: 'تاج ضرس مفرد تم إنجازه بنجاح.',
        createdAt: new Date().toISOString(),
      },
      {
        id: 'blk-003',
        brand: 'Aidite 3D Pro Zir',
        material: 'Zirconia',
        type: 'Disc',
        shade: 'A3',
        thickness: '14mm',
        lotNumber: 'AD-2024-7740',
        status: 'in_use',
        usagePercentage: 35,
        unitsUsed: 9,
        maxEstimatedUnits: 26,
        machineAssigned: 'Imes-Icore 350i',
        notes: 'زركونيا تشريحية كاملة متبقي مساحة لعدة تيجان.',
        createdAt: new Date().toISOString(),
      },
      {
        id: 'blk-004',
        brand: 'Yamahachi Dental PMMA',
        material: 'PMMA',
        type: 'Disc',
        shade: 'A2',
        thickness: '20mm',
        lotNumber: 'YH-PM-5519',
        status: 'in_stock',
        usagePercentage: 0,
        unitsUsed: 0,
        maxEstimatedUnits: 28,
        notes: 'تيجان وجسور مؤقتة طويلة الأمد، جديد بالكرتون.',
        createdAt: new Date().toISOString(),
      }
    ];

    function getMaterialBadgeColor(material) {
      switch (material) {
        case 'Zirconia': return 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/40 dark:text-emerald-300 dark:border-emerald-800';
        case 'E.max': return 'bg-blue-50 text-blue-700 border-blue-200 dark:bg-blue-950/40 dark:text-blue-300 dark:border-blue-800';
        case 'PMMA': return 'bg-purple-50 text-purple-700 border-purple-200 dark:bg-purple-950/40 dark:text-purple-300 dark:border-purple-800';
        case 'Wax': return 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/40 dark:text-amber-300 dark:border-amber-800';
        default: return 'bg-gray-50 text-gray-700 border-gray-200 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-700';
      }
    }

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('cad_lang') || 'ar');
      const [theme, setTheme] = useState(() => localStorage.getItem('cad_theme') || 'light');
      const [blocks, setBlocks] = useState(() => {
        try {
          const saved = localStorage.getItem('cad_dental_blocks_v1');
          return saved ? JSON.parse(saved) : INITIAL_DENTAL_BLOCKS;
        } catch {
          return INITIAL_DENTAL_BLOCKS;
        }
      });

      const [viewMode, setViewMode] = useState('grid');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedMaterial, setSelectedMaterial] = useState('all');
      const [selectedStatus, setSelectedStatus] = useState('all');
      const [selectedType, setSelectedType] = useState('all');
      const [sortBy, setSortBy] = useState('newest');

      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingBlock, setEditingBlock] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
        localStorage.setItem('cad_lang', lang);
      }, [lang]);

      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('cad_theme', theme);
      }, [theme]);

      useEffect(() => {
        localStorage.setItem('cad_dental_blocks_v1', JSON.stringify(blocks));
      }, [blocks]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2500);
      };

      const handleAddBlock = (data) => {
        const isDone = data.status === 'completed' || data.usagePercentage >= 100;
        const newBlock = {
          ...data,
          id: 'blk-' + Date.now(),
          status: isDone ? 'completed' : (data.usagePercentage > 0 ? 'in_use' : 'in_stock'),
          completed: isDone,
          createdAt: new Date().toISOString(),
        };
        setBlocks(prev => [newBlock, ...prev]);
        setIsAddModalOpen(false);
        showToast(lang === 'ar' ? 'تمت إضافة البلوك بنجاح!' : 'Block added successfully!');
      };

      const handleSaveEdit = (updated) => {
        const isDone = updated.status === 'completed' || updated.usagePercentage >= 100;
        const finalized = { ...updated, completed: isDone, status: isDone ? 'completed' : (updated.usagePercentage > 0 ? 'in_use' : 'in_stock') };
        setBlocks(prev => prev.map(b => b.id === finalized.id ? finalized : b));
        setEditingBlock(null);
        showToast(lang === 'ar' ? 'تم تحديث بيانات البلوك!' : 'Block updated!');
      };

      const handleDelete = (id) => {
        if (confirm(lang === 'ar' ? 'هل أنت متأكد من حذف هذا البلوك؟' : 'Delete block?')) {
          setBlocks(prev => prev.filter(b => b.id !== id));
          showToast(lang === 'ar' ? 'تم حذف البلوك' : 'Block deleted');
        }
      };

      const handleAddUnits = (id, delta) => {
        setBlocks(prev => prev.map(b => {
          if (b.id !== id) return b;
          const max = b.maxEstimatedUnits || 20;
          const newUnits = Math.min(max, (b.unitsUsed || 0) + delta);
          const newUsage = Math.min(100, Math.round((newUnits / max) * 100));
          const isDone = newUsage >= 100;
          return {
            ...b,
            unitsUsed: newUnits,
            usagePercentage: newUsage,
            status: isDone ? 'completed' : 'in_use',
            completed: isDone,
          };
        }));
        showToast(lang === 'ar' ? `+${delta} وحدة تفريز` : `+${delta} unit`);
      };

      const handleToggleComplete = (id) => {
        setBlocks(prev => prev.map(b => {
          if (b.id !== id) return b;
          const isDone = b.status === 'completed' || b.usagePercentage >= 100;
          return {
            ...b,
            status: isDone ? 'in_use' : 'completed',
            completed: !isDone,
            usagePercentage: isDone ? 60 : 100,
            unitsUsed: isDone ? b.unitsUsed : (b.maxEstimatedUnits || 20),
          };
        }));
        showToast(lang === 'ar' ? 'تم تحديث حالة البلوك' : 'Status updated');
      };

      const handleCopyLot = (lot) => {
        navigator.clipboard.writeText(lot);
        showToast(lang === 'ar' ? `تم نسخ: ${lot}` : `Copied: ${lot}`);
      };

      const handleExport = () => {
        const dataStr = JSON.stringify(blocks, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dental_cad_blocks_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              setBlocks(parsed);
              showToast(lang === 'ar' ? 'تم استيراد البيانات بنجاح' : 'Imported successfully');
            }
          } catch { alert('ملف غير صالح'); }
        };
        reader.readAsText(file);
      };

      const filteredBlocks = useMemo(() => {
        return blocks.filter(b => {
          const q = searchQuery.toLowerCase().trim();
          const matchQ = !q || (b.lotNumber && b.lotNumber.toLowerCase().includes(q)) ||
            (b.brand && b.brand.toLowerCase().includes(q)) ||
            (b.shade && b.shade.toLowerCase().includes(q)) ||
            (b.notes && b.notes.toLowerCase().includes(q));
          const matchM = selectedMaterial === 'all' || b.material === selectedMaterial;
          const matchT = selectedType === 'all' || b.type === selectedType;
          let matchS = true;
          if (selectedStatus === 'in_stock') matchS = b.status === 'in_stock';
          else if (selectedStatus === 'in_use') matchS = b.status === 'in_use';
          else if (selectedStatus === 'completed') matchS = b.status === 'completed' || b.completed;
          return matchQ && matchM && matchT && matchS;
        }).sort((a, b) => {
          if (sortBy === 'newest') return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
          if (sortBy === 'usageHigh') return b.usagePercentage - a.usagePercentage;
          if (sortBy === 'usageLow') return a.usagePercentage - b.usagePercentage;
          return a.brand.localeCompare(b.brand);
        });
      }, [blocks, searchQuery, selectedMaterial, selectedStatus, selectedType, sortBy]);

      const totalCount = blocks.length;
      const inStockCount = blocks.filter(b => b.status === 'in_stock').length;
      const inUseCount = blocks.filter(b => b.status === 'in_use').length;
      const completedCount = blocks.filter(b => b.status === 'completed' || b.completed).length;
      const totalUnitsMilled = blocks.reduce((acc, curr) => acc + (curr.unitsUsed || 0), 0);

      return (
        <div className="min-h-screen flex flex-col">
          {/* شريط الرأس */}
          <header className="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800">
            <div className="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center shadow-md shadow-teal-500/20">
                  <Icons.Disc className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-lg font-bold tracking-tight">
                    {lang === 'ar' ? 'مختبر الأسنان - إدارة بلوكات الخراطة' : 'Dental Milling Blocks'}
                  </h1>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    {lang === 'ar' ? 'تتبع أقراص الزركونيا، الإيماكس، وتفريز التيجان رقمياً' : 'CAD/CAM Discs & Blocks Tracker'}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => setIsAddModalOpen(true)} className="px-3.5 py-1.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-semibold text-xs flex items-center gap-1 shadow-sm">
                  <Icons.Plus className="w-4 h-4" />
                  <span>{lang === 'ar' ? 'إضافة بلوك' : 'Add Block'}</span>
                </button>
                <button onClick={handleExport} title="تصدير JSON" className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">
                  <Icons.Download className="w-4 h-4" />
                </button>
                <button onClick={() => fileInputRef.current?.click()} title="استيراد JSON" className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">
                  <Icons.Upload className="w-4 h-4" />
                </button>
                <input type="file" ref={fileInputRef} onChange={handleImport} accept=".json" className="hidden" />
                <button onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')} className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">
                  {theme === 'light' ? <Icons.Moon className="w-4 h-4" /> : <Icons.Sun className="w-4 h-4" />}
                </button>
                <button onClick={() => setLang(l => l === 'ar' ? 'en' : 'ar')} className="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-bold">
                  {lang === 'ar' ? 'English' : 'عربي'}
                </button>
              </div>
            </div>
          </header>

          {/* الإحصائيات والفلاتر والعرض */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-5">
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
              <div className="bg-white dark:bg-slate-900 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800">
                <span className="text-xs text-slate-400 font-medium">{lang === 'ar' ? 'إجمالي البلوكات' : 'Total Blocks'}</span>
                <p className="text-2xl font-bold mt-1">{totalCount}</p>
              </div>
              <div className="bg-white dark:bg-slate-900 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800">
                <span className="text-xs text-emerald-600 font-medium">{lang === 'ar' ? 'في المخزن' : 'In Stock'}</span>
                <p className="text-2xl font-bold mt-1 text-emerald-600">{inStockCount}</p>
              </div>
              <div className="bg-white dark:bg-slate-900 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800">
                <span className="text-xs text-amber-600 font-medium">{lang === 'ar' ? 'قيد الخراطة' : 'In Use'}</span>
                <p className="text-2xl font-bold mt-1 text-amber-600">{inUseCount}</p>
              </div>
              <div className="bg-white dark:bg-slate-900 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800">
                <span className="text-xs text-purple-600 font-medium">{lang === 'ar' ? 'مكتملة' : 'Completed'}</span>
                <p className="text-2xl font-bold mt-1 text-purple-600">{completedCount}</p>
              </div>
              <div className="col-span-2 sm:col-span-1 bg-teal-50 dark:bg-slate-900 p-3.5 rounded-xl border border-teal-200 dark:border-teal-800">
                <span className="text-xs text-teal-700 dark:text-teal-400 font-bold">{lang === 'ar' ? 'تيجان منجزة' : 'Milled Units'}</span>
                <p className="text-2xl font-bold mt-1 text-teal-700 dark:text-teal-400">+{totalUnitsMilled}</p>
              </div>
            </div>

            {/* أدوات البحث والفرز */}
            <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 space-y-3">
              <div className="flex gap-3">
                <div className="relative flex-1">
                  <Icons.Search className="absolute top-1/2 -translate-y-1/2 start-3 w-4 h-4 text-slate-400" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder={lang === 'ar' ? 'بحث برقم التشغيلة، الماركة، اللون...' : 'Search lot #, brand, shade...'}
                    className="w-full ps-9 pe-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs"
                  />
                </div>
                <div className="flex gap-1">
                  <button onClick={() => setViewMode('grid')} className={`p-2 rounded-lg border text-xs ${viewMode === 'grid' ? 'bg-teal-50 text-teal-700 border-teal-300' : 'border-slate-200'}`}>
                    <Icons.LayoutGrid className="w-4 h-4" />
                  </button>
                  <button onClick={() => setViewMode('table')} className={`p-2 rounded-lg border text-xs ${viewMode === 'table' ? 'bg-teal-50 text-teal-700 border-teal-300' : 'border-slate-200'}`}>
                    <Icons.List className="w-4 h-4" />
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                <select value={selectedMaterial} onChange={e => setSelectedMaterial(e.target.value)} className="p-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                  <option value="all">جميع المواد (All Materials)</option>
                  <option value="Zirconia">Zirconia (زركونيا)</option>
                  <option value="E.max">E.max (إيماكس)</option>
                  <option value="PMMA">PMMA (مؤقتات)</option>
                  <option value="Wax">Wax (شمع)</option>
                </select>

                <select value={selectedStatus} onChange={e => setSelectedStatus(e.target.value)} className="p-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                  <option value="all">جميع الحالات</option>
                  <option value="in_stock">في المخزن (جديدة)</option>
                  <option value="in_use">قيد الاستخدام</option>
                  <option value="completed">مستهلكة بالكامل</option>
                </select>

                <select value={selectedType} onChange={e => setSelectedType(e.target.value)} className="p-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                  <option value="all">جميع الأشكال</option>
                  <option value="Disc">قرص 98mm Disc</option>
                  <option value="Block">بلوك C14 Block</option>
                </select>

                <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="p-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                  <option value="newest">الأحدث تسجيلاً</option>
                  <option value="usageHigh">الأعلى استهلاكاً</option>
                  <option value="usageLow">الأقل استهلاكاً</option>
                </select>
              </div>
            </div>

            {/* عرض الكروت الشبكية */}
            {filteredBlocks.length === 0 ? (
              <div className="bg-white dark:bg-slate-900 rounded-xl p-8 text-center text-slate-400">
                لا توجد بلوكات مطابقة لخيارات البحث.
              </div>
            ) : viewMode === 'grid' ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {filteredBlocks.map(block => (
                  <div key={block.id} className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between gap-1 mb-2">
                        <div className="flex items-center gap-1.5">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${getMaterialBadgeColor(block.material)}`}>
                            {block.material}
                          </span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium">
                            {block.thickness}
                          </span>
                        </div>
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300">
                          {block.status === 'completed' ? 'مكتمل ✔' : block.status === 'in_stock' ? 'جديد' : 'قيد التفريز'}
                        </span>
                      </div>

                      <h4 className="font-bold text-sm text-slate-900 dark:text-white">{block.brand}</h4>
                      <div className="text-xs font-semibold text-teal-600 mt-1">اللون: {block.shade}</div>

                      <div className="mt-2.5 flex items-center justify-between bg-slate-50 dark:bg-slate-800/60 p-1.5 rounded-lg border border-slate-100 dark:border-slate-800 text-xs font-mono">
                        <span>LOT: {block.lotNumber}</span>
                        <button onClick={() => handleCopyLot(block.lotNumber)} className="text-slate-400 hover:text-teal-600">
                          <Icons.Copy className="w-3.5 h-3.5" />
                        </button>
                      </div>

                      <div className="mt-3">
                        <div className="flex justify-between text-xs mb-1">
                          <span className="text-slate-400">الاستهلاك:</span>
                          <span className="font-bold">{block.usagePercentage}% ({block.unitsUsed || 0}/{block.maxEstimatedUnits || 20} تيجان)</span>
                        </div>
                        <div className="w-full h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                          <div className="h-full bg-teal-500 transition-all duration-300" style={{ width: `${block.usagePercentage}%` }} />
                        </div>
                      </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                      <div className="flex gap-1">
                        <button onClick={() => handleAddUnits(block.id, 1)} disabled={block.usagePercentage >= 100} className="px-2 py-1 rounded bg-teal-50 dark:bg-teal-950/40 text-teal-700 dark:text-teal-300 font-bold text-xs">
                          +1 تاج
                        </button>
                        <button onClick={() => handleAddUnits(block.id, 3)} disabled={block.usagePercentage >= 100} className="px-2 py-1 rounded bg-teal-50 dark:bg-teal-950/40 text-teal-700 dark:text-teal-300 font-bold text-xs">
                          +3 وحدات
                        </button>
                      </div>
                      <div className="flex gap-1">
                        <button onClick={() => handleToggleComplete(block.id)} className="p-1 text-slate-500 hover:text-teal-600">
                          <Icons.RotateCcw className="w-3.5 h-3.5" />
                        </button>
                        <button onClick={() => setEditingBlock(block)} className="p-1 text-slate-500 hover:text-slate-700">
                          <Icons.Edit className="w-3.5 h-3.5" />
                        </button>
                        <button onClick={() => handleDelete(block.id)} className="p-1 text-red-400 hover:text-red-600">
                          <Icons.Trash2 className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              /* عرض الجدول التفصيلي */
              <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-x-auto">
                <table className="w-full text-xs">
                  <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 text-slate-500 text-start">
                    <tr>
                      <th className="p-3 text-start">الماركة والمادة</th>
                      <th className="p-3 text-start">اللون والسماكة</th>
                      <th className="p-3 text-start">رقم التشغيلة</th>
                      <th className="p-3 text-start">الاستهلاك</th>
                      <th className="p-3 text-end">إجراءات</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {filteredBlocks.map(b => (
                      <tr key={b.id}>
                        <td className="p-3 font-bold">{b.brand} <span className="font-normal text-slate-400">({b.material})</span></td>
                        <td className="p-3 text-teal-600 font-semibold">{b.shade} - {b.thickness}</td>
                        <td className="p-3 font-mono">{b.lotNumber}</td>
                        <td className="p-3">{b.usagePercentage}% ({b.unitsUsed || 0}/{b.maxEstimatedUnits || 20})</td>
                        <td className="p-3 text-end">
                          <button onClick={() => handleAddUnits(b.id, 1)} className="px-1.5 py-0.5 bg-teal-50 text-teal-700 font-bold rounded me-1">+1</button>
                          <button onClick={() => handleDelete(b.id)} className="text-red-400">حذف</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </main>

          {/* نافذة الإضافة */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-xl max-w-md w-full p-5 space-y-3">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-800">
                  <h3 className="font-bold text-sm">تسجيل بلوك تفريز جديد</h3>
                  <button onClick={() => setIsAddModalOpen(false)}><Icons.X className="w-4 h-4" /></button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const f = e.target;
                  handleAddBlock({
                    brand: f.brand.value,
                    material: f.material.value,
                    type: f.type.value,
                    shade: f.shade.value,
                    thickness: f.thickness.value,
                    lotNumber: f.lotNumber.value || ('LOT-' + Math.floor(1000 + Math.random() * 9000)),
                    maxEstimatedUnits: Number(f.capacity.value) || 20,
                    unitsUsed: 0,
                    usagePercentage: 0,
                    status: 'in_stock',
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block mb-1 font-medium">الشركة / الماركة:</label>
                    <input name="brand" required placeholder="مثال: Kuraray Katana" className="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-800 border" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block mb-1 font-medium">المادة:</label>
                      <select name="material" className="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-800 border">
                        <option value="Zirconia">Zirconia</option>
                        <option value="E.max">E.max</option>
                        <option value="PMMA">PMMA</option>
                        <option value="Wax">Wax</option>
                      </select>
                    </div>
                    <div>
                      <label className="block mb-1 font-medium">الشكل:</label>
                      <select name="type" className="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-800 border">
                        <option value="Disc">قرص 98mm</option>
                        <option value="Block">بلوك C14</option>
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block mb-1 font-medium">اللون (Shade):</label>
                      <input name="shade" required placeholder="A1, A2, BL2..." className="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-800 border" />
                    </div>
                    <div>
                      <label className="block mb-1 font-medium">السماكة:</label>
                      <input name="thickness" required placeholder="14mm, 18mm, C14..." className="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-800 border" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block mb-1 font-medium">رقم التشغيلة (Lot #):</label>
                      <input name="lotNumber" placeholder="تلقائي إن ترك فارغاً" className="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-800 border" />
                    </div>
                    <div>
                      <label className="block mb-1 font-medium">عدد التيجان التقديري:</label>
                      <input name="capacity" type="number" defaultValue={20} className="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-800 border" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsAddModalOpen(false)} className="px-3 py-1.5 rounded-lg border">إلغاء</button>
                    <button type="submit" className="px-3 py-1.5 rounded-lg bg-teal-600 text-white font-bold">حفظ</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* إشعار عائم Toast */}
          {toastMessage && (
            <div className="fixed bottom-5 start-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow-xl">
              <Icons.Check className="w-4 h-4 text-teal-400" />
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
